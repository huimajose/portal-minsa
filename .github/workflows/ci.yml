name: Portal MINSA CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
        env:
          MINSA_SESSION_SECRET: ci-only-session-secret
          AUTH_SERVICE_BASE_URL: https://auth.example.invalid
          STATISTICS_SERVICE_BASE_URL: https://statistics.example.invalid
